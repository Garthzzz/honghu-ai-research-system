# ══ 散户情绪市场窗口 V2（公司页；新闻不进入 V2 聚合）══════════════════
sentiment_layers:
  # canonical 边界在 senti3.py；这里仅声明运维节奏。周末不请求、不入新 feed。
  schedule:
    timezone: Asia/Shanghai
    weekdays: [monday, tuesday, wednesday, thursday, friday]
    windows:
      preopen: {run_at: "10:00", segments: ["prior_session 16:00-24:00", "session 00:00-09:30"]}
      morning: {run_at: "14:00", segments: ["session 09:30-13:00"]}
      afternoon: {run_at: "17:00", segments: ["session 13:00-16:00"]}
    auto_backfill_start: "2026-07-15" # V2 live 切换点；此前 pending 是历史映射兼容行，不自动外抓
    backfill_max_days: 3              # 与 raw 三天工作层一致；到期窗口不再重开或重新生成已清理原文
    backfill_max_windows_per_tick: 3  # 当前窗口优先；每次再按时间顺序有限回补最多 3 个已到期缺口
  # ── 限流(M-FETCH 令牌桶,绝不超频)──
  rate_limit:
    infos_interval_sec: 65            # 合同上限1次/60s；留5秒边界余量，降低供应商429且不提高QPS
    max_pages_per_window: 30          # 单个进程内页块上限；满页后复用同一 snapshot+精确 offset 续抓
    max_continuation_chunks_per_segment: 8 # 单片段最多 8 个安全页块（最多 240 页），仍超限则显式 partial
    rate_limit_retries: 8             # 429 原页长等待重试，覆盖供应商分钟/短时段双重限额
    rate_limit_backoff_sec: 60        # 无 Retry-After 时 60/120/240 秒指数退避
    resume_overlap_seconds: 180       # 仅升级前无 checkpoint 的历史 partial 用 3 分钟重叠建立首个检查点
  # ── 分层抽样(替换"每桶前N条"有偏抽样;热帖优先+保底随机)── 2026-06-15 ──
  #    按 (platform, company, bucket) 独立抽:≤max 全打;>max 取 Top(按 heat 降序)+ 真随机保底。
  sampling:
    max_per_bucket: 50               # 桶内该源帖数上限(超则抽样)
    top_by_heat: 40                  # 热帖优先:按 heat_value 降序取前 N
    random_floor: 10                 # 保底真随机条数(seed=hash(bucket+platform) 可复现,绝不退化"取后N条")
    reply_heat_weight: 3             # guba 热度 heat=read + reply*该权重(评论比浏览更费力 → 更高权重)
    coverage_low: 0.5                # coverage<该值 → 标"抽样估计"(低覆盖)
  # ── 散户层来源权重(微博已退出散户抓取和计算)──
  retail:
    weights: {xueqiu: 1.0, eastmoney: 1.0, ths: 1.0, guba: 1.0}
    significance_min: 10              # valid_count>10 才出分
  # ── 新闻层(星瀚 sites,与散户独立)──
  news:
    sites: ["新浪新闻", "网易新闻", "凤凰网", "今日头条"]
    weixin_media_type: "6"
  # ── 股吧(自爬 Playwright,DeepSeek 三分类)──
  guba:
    pages_per_stock: 128        # 每页50帖,按原帖时间翻到窗口起点即停;覆盖极活跃股约6400帖,仍未越界则明确 truncated
    score_max_per_run: 0        # V2 默认完整公平评分；0=不做全局截断
  # ── 按行业专题 id 映射(??缺=待配置,不造数;厂商给 subject_id 后填入)──
  #    key=research.db industry.id;value=星瀚专题id。空串/缺省 → 该行业走全局池探测(id="")
  industry_subjects: {}
  global_probe_subject: ""           # 全局探测专题(""=全部监测池);厂商未配行业专题时的兜底
  # ── 已发现的活跃平台专题（仅用于公司/原始 feed 归因，不再生产关键词情绪）──
  platform_subjects:
    - {id: "a58a7da97e1243c68ad1c3ec1fa13ab9", platform: xueqiu,    name: "雪球"}
    - {id: "ff605f0fac2f46f7aad7d9ed49477a5f", platform: eastmoney, name: "东财股吧"}
    - {id: "510b0191e12549589f1a205fd79da4e9", platform: ths,       name: "同花顺"}
  fetch_since: "2026-06-22T00:00"    # 全集情绪起始(本次重构数据起点)
