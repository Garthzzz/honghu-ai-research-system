# Stage 3 动态情报模块 — 配置(可复用核心:新行业/新 leader 只改这里 + db,不改代码)
# v2 review 修订已内置:R3(importance 整数)/R5(scheduler 用最新时刻)/R6(Apify 可选)
# 信源链路重构 v3(2026-06-09)已内置:runtime/quiet_hours/deepseek/topic_gate/tag_validation

# ── 运行时(迁移友好:时区/频率全走这里)──────────────────────────────────────
runtime:
  timezone: Asia/Shanghai
  tick_frequency_min: 15

# ── 静默窗口：工作日 [20:00,次日08:00) + 周六日全天；闸在 scheduler.tick 顶部──
quiet_hours:
  start: "20:00"
  end:   "08:00"
  # 覆盖 schedule.region_windows 的 us 峰窗 21:00–08:00(静默优先,夜间一律不跑/不处理/不调 API)

# ── DeepSeek(OpenAI 兼容;key 走 secrets 文件 / 环境变量,绝不入本文件)──────────
deepseek:
  enabled: true
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  api_key_file: tools/dynamic/secrets/deepseek_api_key.txt   # 读取顺序①(相对项目根,gitignore)
  api_key_env:  DEEPSEEK_API_KEY               # 读取顺序②(环境变量)
  # llm_client 顺序:先 file、后 env,都没有 → disabled 返回 None,不编造
  context_cache: true            # D5:B2 复用 B1 已发正文走缓存,消双倍输入
  max_tokens: 800
  timeout_sec: 40
  max_retries: 2

# ── topic 收严双闸 ───────────────────────────────────────────────────────────
topic_gate:
  prefilter: keyword             # 漏斗 A:关键词预过滤(高召回,无 token)
  require_ai_relevant: true      # 漏斗 B1:is_relevant=false 丢弃
  min_importance: 3              # 极性 1=最重要 → 保留 importance≤3(丢 4/5);看分布再收紧
  dropped_ledger: dynamic_seen   # 被杀条目记账本(D6)
  # KOL relevance 闸只对"高噪声"账号生效:列在此处的 handle 走完整漏斗(A→B1 丢弃),
  # 其余意见领袖只做富化(tag/翻译/摘要),绝不因相关性被丢(全部 is_ai_relevant=1)。
  # 新闻不受此项影响,始终走完整漏斗。
  voice_filter_handles: [elonmusk]

# ── tag grounded 闭集校验(D4:LLM 提议、grounded 裁决)──────────────────────────
tag_validation:
  closed_set: [db_company, industries_final]   # 闭集 = company 全表 ∪ industries_final
  drop_out_of_set: true

# ── 平台抓取参数 ─────────────────────────────────────────────────────────────
platforms:
  xueqiu:
    fetcher: XueqiuFetcher
    mode: api                     # ?? 舆情快搜 API-first(智慧星光);cookie/HTTP 兜底(保持原功能)
    api:                          # KuaiSearchClient 配置(契约见 docs/yuqing-api-info.txt)
      subject_id: ""              # 专题id(""=全部监测;拿到「专题列表」端点后可精确指定降本)
      media_types: []             # 雪球无独立媒体枚举 → 全媒体拉取,按作者 uid 客户端硬过滤
      window_hours: 3             # 小窗(tick 1h):QPS 1/60s 无法翻页,降重叠计费 + 提高本人帖落单页概率
      cache_ttl_sec: 900          # 同 tick 多领袖共用一次拉取(降 QPS/计费)
      min_interval_sec: 65        # 与窗口抓取共享原子令牌；合同60s上限外留5s边界余量
      limit: 180                  # 单页上限 180
    min_interval_sec: 8           # 单平台请求间隔(反爬,老路径)
    needs_cookie: true            # cookie 兜底(Stage 3-D 前;API 不可用时用)
    priority_urls:                # 优先级链(healthcheck 验证)
      - "https://xueqiu.com/v4/statuses/user_timeline.json?user_id={handle}&page=1"
    fallback: [api, requests_html, playwright, manual]
  weibo:
    fetcher: WeiboFetcher
    mode: api                     # 仅抓下方三位 KOL；不进入散户情绪，不登录/请求微博网页
    api:
      subject_id: ""
      media_types: [4]            # 舆情 API 的微博媒体类型
      account_type: "3"          # 重点账号池；返回后仍按作者 UID 精确匹配
      sites: ["新浪微博"]
      window_hours: 24
      cache_ttl_sec: 900          # 三位作者共享同一次 API 响应
      min_interval_sec: 65
      limit: 180
  twitter:                        # db platform='twitter',前端显示 X
    fetcher: XFetcher
    min_interval_sec: 5
    needs_cookie: false
    mode: playwright              # ?? playwright(正式路线) | api(占位,本次不实现)
    storage_state_file: secrets/x_storage_state.json   # playwright 登录态(暂无→撞登录墙 auth_expired)
    # 抓取顺序(用户指定):先 Nitter RSS(多实例)→ 全失败则 playwright 直连 x.com → auth_expired
    nitter_instances:
      - "https://nitter.net/{handle}/rss"
      - "https://nitter.poast.org/{handle}/rss"
      - "https://nitter.privacydev.net/{handle}/rss"
      - "https://nitter.tiekoetter.com/{handle}/rss"
      - "https://nitter.1d4.us/{handle}/rss"
      - "https://nitter.kavin.rocks/{handle}/rss"
    x_max_attempts: 2             # 铁律:每源有限次尝试,失败即 auth_expired 继续(防 IP 风控)
    apify_optional: true
    apify_token_env: APIFY_TOKEN
    fallback: [nitter, playwright, manual]

# ── 时区智能调度(本机北京时间判断;us 账号"美东日间"≈北京 21:00-08:00,跨午夜 OR)──
schedule:
  # 所有意见领袖统一按北京时间工作时段抓取；17:00 这一档允许启动，17:00 后静默。
  voice_window: {start: "09:00", end: "17:00", frequency_minutes: 60}
  region_windows:
    cn: {peak_start: "09:00", peak_end: "23:00", peak_min: 60, off_min: 60}
    us: {peak_start: "21:00", peak_end: "08:00", peak_min: 60, off_min: 60}   # 跨午夜 → in_peak 用 OR
    global: {peak_start: "08:00", peak_end: "23:00", peak_min: 60, off_min: 60}
  news_min: 60                    # ?? 新闻 1h(180→60)
  event_calendar_min: 1440        # 事件日历每日 1 次
  stale_lock_minutes: 30          # is_running 僵死自动重置阈值(修订3)

# ── 突发检测:中英双语簇(修订5,覆盖英文白名单源)────────────────────────────
breaking:
  window_hours: 6
  min_sources: 2                  # 同簇 ≥2 白名单源 → is_breaking
  clusters:
    supply_disruption: [断供, 停产, 缺货, 停供, supply disruption, shortage, halt production, cut off]
    price_hike:        [涨价, 提价, 涨幅, price hike, price increase, surge, jump]
    acquisition:       [收购, 并购, 入股, acquire, acquisition, merger, stake, buyout]
    export_control:    [出口管制, 制裁, 实体清单, 禁运, export control, sanction, entity list, ban, restriction]
    yield_issue:       [良率, 流片, 事故, 缺陷, 召回, yield, tape-out, defect, recall]
    capacity:          [扩产, 产能, 投产, capacity, fab, ramp, expansion]

