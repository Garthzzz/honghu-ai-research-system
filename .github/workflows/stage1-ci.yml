name: Honghu Protected CI

on:
  pull_request:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "feature/**"
      - "phase2/**"
      - "phase3/**"

permissions:
  contents: read

concurrency:
  group: stage1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-and-contracts:
    name: boundary-and-contracts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Node for OpenSpec validation
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install the pinned OpenSpec CLI
        shell: pwsh
        run: npm install --global @fission-ai/openspec@1.6.0

      - name: Validate tracked repository boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cache/git_bootstrap | Out-Null
          python tools/maintenance/git_stage1_guard.py gate --scope tracked --output cache/git_bootstrap/ci_tracked_gate.json

      - name: Enforce the SQLite dependency ratchet
        shell: pwsh
        run: |
          python tools/maintenance/git_stage1_guard.py sqlite-ratchet --baseline config/sqlite_dependency_baseline.json --output cache/git_bootstrap/ci_sqlite_ratchet.json

      - name: Validate the approved OpenSpec change
        shell: pwsh
        run: openspec validate github-vm-dual-node-operations --strict

      - name: Build evidence bound to the checked-out commit
        shell: pwsh
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/maintenance/build_stage1_evidence.py
          python -m tools.maintenance.build_stage5_evidence

      - name: Upload exact-commit Stage 1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage1-evidence-${{ github.sha }}
          path: cache/git_bootstrap/stage1_evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-commit Stage 5 code identity
        uses: actions/upload-artifact@v4
        with:
          name: stage5-code-identity-${{ github.sha }}
          path: cache/git_bootstrap/stage5_evidence/
          if-no-files-found: error
          retention-days: 30

  python-clean-environment:
    name: python-clean-environment
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      HONGHU_CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node for browser contract tests
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up the supported Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install the exact locked environment
        shell: pwsh
        run: python -m pip install --require-hashes --requirement requirements.lock.txt

      - name: Compile tracked Python sources and tests
        shell: pwsh
        run: python -m compileall -q tools tests

      - name: Validate clean-clone test collection
        shell: pwsh
        run: python tools/ci/run_test_tier.py --collect-only

      - name: Run clean-clone core tests
        shell: pwsh
        run: python tools/ci/run_test_tier.py

      - name: Build immutable release evidence bound to the checked-out commit
        shell: pwsh
        run: python -m tools.maintenance.build_stage2_evidence

      - name: Upload exact-commit Phase 2 release evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-release-evidence-${{ github.sha }}
          path: cache/git_bootstrap/stage2_evidence/
          if-no-files-found: error
          retention-days: 30
